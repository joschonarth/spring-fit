spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  expiration: 900000
  refresh-expiration: 604800000
  key: test-secret-key-only-used-in-automated-tests-do-not-use-in-production

rate-limit:
  auth:
    capacity: 1000
    refill-period-seconds: 60
  api:
    capacity: 1000
    refill-period-seconds: 60