name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by conventional commit type
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(\w+)(\(.+\))?!?:/);

            const typeToLabel = {
              feat: "feature",
              fix: "bug",
              docs: "documentation",
              refactor: "refactor",
              perf: "performance",
              test: "test",
              build: "build",
              ci: "ci",
              chore: "chore",
              revert: "revert",
              style: "style",
              deps: "dependencies",
            };

            if (!match) return;

            const label = typeToLabel[match[1]];
            if (!label) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });